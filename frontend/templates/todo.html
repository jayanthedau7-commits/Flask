<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do Page</title>
    <style>
        body {
            background-color: bisque;
            font-family: Arial, Helvetica, sans-serif;
            text-align: center;
        }

        form {
            width: 300px;
            margin: 30px auto;
            text-align: left;
        }

        label {
            display: block;
            margin: 12px 0 4px;
        }

        input, textarea {
            width: 100%;
            padding: 8px;
            font-size: 16px;
        }

        button {
            margin-top: 16px;
            padding: 8px 20px;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <h1>To-Do Page</h1>

    <form action="{{ backend_url }}/submittodoitem" method="POST">
        <label for="itemName">Item Name</label>
        <input type="text" id="itemName" name="itemName" required>

        <label for="itemDescription">Item Description</label>
        <textarea id="itemDescription" name="itemDescription" rows="4" required></textarea>
        <label for="itemId">Item ID</label>
        <input type="text" id="itemId" name="itemId">
        <label for="itemUuid">Item UUID</label>
        <input type="text" id="itemUuid" name="itemUuid">
        <button type="submit">Add Item</button>
    </form>
</body>
</html>
